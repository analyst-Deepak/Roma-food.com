  <g transform="translate(460, 340) scale(0.8) rotate(10)">
    <path d="M50,180 C40,120 60,70 110,30 C150,70 160,120 120,180 Z" />
    <path d="M110,30 C70,10 30,30 20,70 C20,110 50,140 80,165" opacity="0.7" />
    <path d="M110,30 C150,10 180,40 180,80 C170,120 140,150 110,170" opacity="0.7" />
    <path d="M100,175 C95,230 115,280 150,320" />
    <path d="M105,230 C70,220 50,235 40,255 C65,265 88,260 105,245 Z" />
