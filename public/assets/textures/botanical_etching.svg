    <path d="M75,115 C95,90 125,85 145,90" opacity="0.6" />
    <path d="M110,95 C125,75 150,70 165,72" opacity="0.6" />
    <path d="M45,135 C50,155 70,165 90,165" opacity="0.6" />
    <path d="M75,115 C85,135 105,145 125,145" opacity="0.6" />
    <!-- Cacao Pod Outline -->
    <path d="M140,160 C120,200 130,260 160,300 C180,260 190,200 170,160 C155,145 150,145 140,160 Z" />
    <path d="M155,150 C145,190 148,250 160,300" opacity="0.7" />
    <path d="M155,150 C165,190 172,250 160,300" opacity="0.7" />
  </g>

  <!-- Botanical Blossom & Vines (Bottom Left) -->
  <g transform="translate(180, 360) scale(0.75) rotate(-35)">
    <path d="M100,50 C70,20 30,40 20,80 C20,120 60,150 100,180 C140,150 180,120 180,80 C170,40 130,20 100,50 Z" />
