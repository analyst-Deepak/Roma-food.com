<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
  <!-- Botanical Flower 1 (Top Left) -->
  <g transform="translate(60, 40) scale(0.9) rotate(-15)">
